[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "civicflow-contracts"
version = "1.0.0"
description = "Shared Pydantic contracts for CivicFlow service-to-service communication"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
[tool.hatch.build.targets.wheel]
packages = ["civicflow_contracts"]
