[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "civicflow-ai-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "pydantic>=2.7,<3", "langgraph>=0.2", "civicflow-contracts"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.uv.sources]
civicflow-contracts = { path = "../../contracts/civicflow_contracts", editable = true }
